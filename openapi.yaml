openapi: 3.0.3
info:
  title: Documentation Sync Demo API
  version: 1.0.0
  description: A small contract used to demonstrate automatic API reference generation.
servers:
  - url: https://api.example.com/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      responses:
        '200':
          description: The service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /items:
    post:
      operationId: createItem
      summary: Create an item
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
      responses:
        '201':
          description: The item was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: The request was invalid.
components:
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    NewItem:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Display name for the item.
    Item:
      allOf:
        - $ref: '#/components/schemas/NewItem'
        - type: object
          required:
            - id
          properties:
            id:
              type: string
